        - paragraph [ref=e22]: Nov 2, 2025 · 1 min read
        - heading "Serving millions of records in under a minute" [level=1] [ref=e23]
        - generic [ref=e24]:
          - generic [ref=e25]: "#Architecture"
          - generic [ref=e26]: "#Performance"
          - generic [ref=e27]: "#Microservices"
        - generic [ref=e28]:
          - generic [ref=e29]: Share
          - button "Copy link" [ref=e30] [cursor=pointer]
          - button "X" [ref=e35] [cursor=pointer]
          - button "LinkedIn" [ref=e36] [cursor=pointer]
      - generic [ref=e37]:
        - paragraph [ref=e38]: "Some services have one job and have to do it fast. This one had two jobs with very different shapes: answer individual lookups in single-digit milliseconds, and materialize an entire multi-million-row, multi-gigabyte dataset in under a minute when a full pull was requested."
        - heading "The constraint" [level=2] [ref=e39]
        - paragraph [ref=e40]: Optimizing for one pattern usually hurts the other. Tight per-record latency wants small, cached, index-friendly reads. A full pull wants large, sequential, batched I/O. Treating them as the same code path is how you end up slow at both.
        - heading "Sub-10ms hot paths" [level=2] [ref=e41]
        - paragraph [ref=e42]: "For individual lookups the wins were unglamorous and effective: shape the data for the read, keep the hot set in memory, and avoid chatty round-trips. Once the query plan was stable and the working set fit, average response settled into the sub-10ms range and stayed there under load."
        - heading "The bulk pull" [level=2] [ref=e43]
        - paragraph [ref=e44]:
          - text: The full pull was a different problem. Instead of millions of small reads, it became a streamed, batched export — read in large chunks, keep memory bounded, and never hold the whole result set at once. The target wasn't
          - emphasis [ref=e45]: lowest latency per record
          - text: ", it was"
          - emphasis [ref=e46]: bounded, predictable total time
          - text: — and it landed under a minute.
        - heading "What mattered" [level=2] [ref=e47]
        - list [ref=e48]:
          - listitem [ref=e49]:
            - strong [ref=e50]: Measure first.
            - text: The bottleneck was never where intuition said it was.
          - listitem [ref=e51]:
            - strong [ref=e52]: Separate the access patterns.
            - text: Two paths, each optimized for its own shape, beat one clever path trying to serve both.
          - listitem [ref=e53]:
            - strong [ref=e54]: Bound your memory.
            - text: Streaming beats buffering the moment the data outgrows a comfortable slice of RAM.
        - paragraph [ref=e55]: None of this was exotic. It was picking the right shape for each job and refusing to let the two contaminate each other.
