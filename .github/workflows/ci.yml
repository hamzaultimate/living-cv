name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (.NET 10)
    # Windows matches the project's toolchain (win-x64 publish + the Tailwind CLI step).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Portfolio.Web/Portfolio.Web.csproj

      - name: Build
        run: dotnet build src/Portfolio.Web/Portfolio.Web.csproj -c Release --no-restore
