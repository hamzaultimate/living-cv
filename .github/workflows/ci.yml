name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (.NET 10)
    # The build is cross-platform (the Tailwind CLI step picks the right standalone binary per OS),
    # so Linux is used for speed; the Azure deploy publishes win-x64 separately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Portfolio.slnx

      # TailwindRequired=true makes the build fail if the Tailwind CLI can't be downloaded,
      # instead of silently falling back to the committed wwwroot/css/app.css.
      - name: Build
        run: dotnet build Portfolio.slnx -c Release --no-restore -p:TailwindRequired=true

      # If this fails, the build regenerated app.css: commit the updated file.
      - name: Check committed Tailwind CSS is up to date
        run: git diff --exit-code -- src/Portfolio.Web/wwwroot/css/app.css

      - name: Test
        run: dotnet test Portfolio.slnx -c Release --no-build
